topis.route-traffic.max-bearing-diff-degrees=45
topis.route-traffic.max-links-per-direction=1
topis.route-traffic.master-cache-ttl-ms=60000
topis.simulation-traffic.area.default-radius-km=2.5
topis.simulation-traffic.speed-prefetch.enabled=true
topis.simulation-traffic.speed-prefetch.max-concurrency=12
topis.simulation-traffic.speed-prefetch.max-wait-ms=3500
topis.simulation-traffic.speed-prefetch.max-links=160

road-link.max-match-distance-meters=150
road-link.mapping.interval-ms=86400000

